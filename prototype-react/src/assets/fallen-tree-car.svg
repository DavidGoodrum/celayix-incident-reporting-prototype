<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9bccb"/>
      <stop offset="1" stop-color="#dfe5e9"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d5f62"/>
      <stop offset="1" stop-color="#36373a"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6f9a"/>
      <stop offset="1" stop-color="#284a68"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfdde6"/>
      <stop offset="1" stop-color="#7f97a6"/>
    </linearGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d5d3c"/>
      <stop offset="1" stop-color="#4a3420"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </radialGradient>
  </defs>
  <rect width="480" height="480" fill="url(#sky)"/>
  <path d="M0 200 Q60 140 120 185 Q180 130 250 180 Q320 140 400 185 Q440 160 480 175 L480 230 L0 230 Z" fill="#4c6847"/>
  <rect y="230" width="480" height="250" fill="url(#asphalt)"/>
  <path d="M30 480 L90 240 M450 480 L400 240" stroke="#e9e6dc" stroke-width="5" opacity=".8"/>
  <!-- car -->
  <ellipse cx="240" cy="408" rx="170" ry="16" fill="#000" opacity=".3"/>
  <path d="M80 395 L80 335 Q85 315 110 310 L150 305 L190 255 Q200 245 220 245 L310 245 Q330 245 345 260 L385 305 L395 308 Q405 312 405 330 L405 395 Z" fill="url(#car)"/>
  <path d="M200 262 Q206 256 218 256 L248 256 L248 302 L165 305 Z" fill="url(#glass)"/>
  <path d="M260 256 L305 256 Q318 256 328 266 L362 302 L260 302 Z" fill="url(#glass)"/>
  <rect x="90" y="345" width="40" height="12" rx="4" fill="#f0e6b8"/>
  <rect x="368" y="345" width="30" height="12" rx="4" fill="#b8322a"/>
  <circle cx="145" cy="395" r="30" fill="#1d1e20"/><circle cx="145" cy="395" r="13" fill="#9a9ea3"/>
  <circle cx="340" cy="395" r="30" fill="#1d1e20"/><circle cx="340" cy="395" r="13" fill="#9a9ea3"/>
  <!-- dent / cracked windshield -->
  <path d="M215 268 L232 285 L225 296 M232 285 L246 280" stroke="#fff" stroke-width="2" opacity=".8" fill="none"/>
  <!-- branches resting on roof -->
  <path d="M-10 170 L300 255 L292 278 L-10 198 Z" fill="url(#bark)"/>
  <g stroke="#55402a" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M230 240 L280 300"/><path d="M190 228 L170 300"/><path d="M260 250 L330 240"/><path d="M120 210 L90 150"/>
  </g>
  <g fill="#3e6233">
    <circle cx="285" cy="300" r="28"/><circle cx="170" cy="300" r="26"/><circle cx="335" cy="238" r="26"/><circle cx="88" cy="148" r="34"/><circle cx="230" cy="215" r="24"/>
  </g>
  <g fill="#5a7f48" opacity=".9">
    <circle cx="300" cy="290" r="15"/><circle cx="350" cy="228" r="14"/><circle cx="100" cy="135" r="18"/>
